name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # A solution can't be built for one RID, so build each entry project.
      - name: Build
        run: |
          foreach ($p in 'tests/Sway.Core.Tests', 'tools/Sway.Probe') {
            dotnet build $p -c Release -r win-${{ matrix.arch }}
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: Test
        if: matrix.arch == 'x64'
        run: dotnet test tests/Sway.Core.Tests -c Release -r win-x64 --no-build
